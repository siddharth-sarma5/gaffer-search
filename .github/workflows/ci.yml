name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older, still-running run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [asan, release]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc-13' || 'clang-18' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++-13' || 'clang++-18' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libclang-rt-18-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  tsan:
    name: gcc / tsan (concurrency)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build
      # TSan maps shadow memory at fixed ranges; the high ASLR entropy on
      # recent runner kernels makes it abort with "unexpected memory mapping".
      - name: Lower ASLR entropy for ThreadSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset tsan
      - name: Build
        run: cmake --build --preset tsan
      - name: Test (whole suite, incl. server fault-injection tests)
        run: ctest --preset tsan

  docker:
    name: docker compose cluster
    runs-on: ubuntu-24.04
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Build image and start broker + 4 shards
        run: $COMPOSE up --build -d
      - name: Query through the broker
        run: |
          # The broker becomes ready once every shard has answered its stats request.
          for i in $(seq 1 30); do
            if $COMPOSE run --rm client > out.txt 2>&1; then break; fi
            sleep 2
          done
          cat out.txt
          grep -q "from 4 shards" out.txt
          ! grep -q "PARTIAL" out.txt
      - name: Stop a shard and expect flagged partial results
        run: |
          $COMPOSE stop shard2
          $COMPOSE run --rm client | tee out2.txt
          grep -q "PARTIAL RESULTS: 3 of 4 shards answered" out2.txt
      - name: Logs
        if: failure()
        run: $COMPOSE logs
      - name: Tear down
        if: always()
        run: $COMPOSE down

  corpusgen:
    name: corpusgen (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tools/corpusgen/tests -t tools/corpusgen -v
      - name: Committed corpus is up to date
        working-directory: tools/corpusgen
        run: |
          python -m corpusgen \
            --input ../../data/raw/openfootball/2025-26/1-premierleague-full.txt \
            --output /tmp/pl-2025-26.tsv
          cmp /tmp/pl-2025-26.tsv ../../data/corpus/pl-2025-26.tsv
          python -m corpusgen.history \
            --input-dir ../../data/raw/openfootball/history --output /tmp/pl-history.tsv
          cmp /tmp/pl-history.tsv ../../data/corpus/pl-history.tsv
      - name: Committed relevance judgements are up to date
        run: |
          cp eval/queries.tsv /tmp/queries.tsv && cp eval/qrels.tsv /tmp/qrels.tsv
          PYTHONPATH=tools/corpusgen python eval/make_qrels.py
          cmp /tmp/queries.tsv eval/queries.tsv && cmp /tmp/qrels.tsv eval/qrels.tsv
      - name: Vendored history files match their checksums
        working-directory: data/raw/openfootball/history
        run: sha256sum --check --quiet SHA256SUMS

  lint:
    name: clang-format / clang-tidy
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      CLANG_FORMAT: clang-format-18
      CLANG_TIDY: clang-tidy-18
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build clang-format-18 clang-tidy-18
      - name: clang-format
        run: tools/check-format.sh
      - name: Configure (for compile_commands.json)
        run: cmake --preset debug
      - name: clang-tidy
        run: tools/run-clang-tidy.sh build/debug
