name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older, still-running run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [asan, release]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc-13' || 'clang-18' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++-13' || 'clang++-18' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libclang-rt-18-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  corpusgen:
    name: corpusgen (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tools/corpusgen/tests -t tools/corpusgen -v
      - name: Committed corpus is up to date
        working-directory: tools/corpusgen
        run: |
          python -m corpusgen \
            --input ../../data/raw/openfootball/2025-26/1-premierleague-full.txt \
            --output /tmp/pl-2025-26.tsv
          cmp /tmp/pl-2025-26.tsv ../../data/corpus/pl-2025-26.tsv
          python -m corpusgen.history \
            --input-dir ../../data/raw/openfootball/history --output /tmp/pl-history.tsv
          cmp /tmp/pl-history.tsv ../../data/corpus/pl-history.tsv
      - name: Vendored history files match their checksums
        working-directory: data/raw/openfootball/history
        run: sha256sum --check --quiet SHA256SUMS

  lint:
    name: clang-format / clang-tidy
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      CLANG_FORMAT: clang-format-18
      CLANG_TIDY: clang-tidy-18
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build clang-format-18 clang-tidy-18
      - name: clang-format
        run: tools/check-format.sh
      - name: Configure (for compile_commands.json)
        run: cmake --preset debug
      - name: clang-tidy
        run: tools/run-clang-tidy.sh build/debug
